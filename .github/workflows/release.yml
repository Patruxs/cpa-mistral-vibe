name: Build and release plugin

on:
  push:
    branches: ['**']
    tags: ['v*']
  pull_request:

permissions:
  contents: write

jobs:
  metadata:
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - name: Check plugin and registry versions
        id: version
        shell: bash
        run: |
          set -euo pipefail
          version="$(jq -r '.plugins[0].version' marketplace/registry.json)"
          test -n "$version" && test "$version" != null
          jq -e '.schema_version == 1 and .plugins[0].id == "cpa-mistral-vibe" and .plugins[0].install.type == "github-release"' marketplace/registry.json
          grep -Fqx "const pluginVersion = \"$version\"" cmd/cpa-mistral-vibe/version.go
          if [[ "${GITHUB_REF_TYPE:-}" == tag ]]; then
            test "${GITHUB_REF_NAME}" = "v$version"
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

  build:
    needs: metadata
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        arch: [amd64, arm64]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
        if: matrix.arch == 'arm64'
        with:
          platforms: arm64
      - name: Build ${{ matrix.arch }} shared library
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          docker run --rm --platform linux/${{ matrix.arch }} -v "$PWD:/src" -w /src \
            -e CGO_ENABLED=1 -e GOOS=linux -e GOARCH=${{ matrix.arch }} \
            golang:1.26-bookworm sh -ec '
              apt-get update >/dev/null && apt-get install -y --no-install-recommends gcc libc6-dev >/dev/null
              go build -trimpath -buildvcs=false -buildmode=c-shared -ldflags="-s -w" \
                -o dist/cpa-mistral-vibe.so ./cmd/cpa-mistral-vibe
              chmod a+r dist/cpa-mistral-vibe.so'
          file dist/cpa-mistral-vibe.so
      - name: Package
        shell: bash
        run: |
          set -euo pipefail
          archive="dist/cpa-mistral-vibe_${{ needs.metadata.outputs.version }}_linux_${{ matrix.arch }}.zip"
          ( cd dist && zip -j "$(basename "$archive")" cpa-mistral-vibe.so )
          test "$(unzip -Z1 "$archive")" = cpa-mistral-vibe.so
      - uses: actions/upload-artifact@v4
        with:
          name: package-linux-${{ matrix.arch }}
          path: dist/cpa-mistral-vibe_*.zip
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [metadata, build]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true
      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/cpa-mistral-vibe_*.zip
          fail_on_unmatched_files: true
